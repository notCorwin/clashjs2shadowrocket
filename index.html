<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="在浏览器中生成 Clash JS 和 Shadowrocket 分流规则" />
    <title>Clash JS / Shadowrocket 规则生成器</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="shell">
      <header>
        <p class="eyebrow">STATIC · CLIENT-SIDE</p>
        <h1>Clash JS / Shadowrocket<br /><span>规则生成器</span></h1>
        <p class="intro">维护一份规则源，同时生成两种代理客户端配置。所有处理都在浏览器本地完成，不会上传规则。</p>
      </header>

      <nav class="mode-tabs" aria-label="功能模式">
        <button class="mode active" data-mode="generator">规则生成器 <small>推荐</small></button>
        <button class="mode" data-mode="converter">配置转换器 <small>高级</small></button>
      </nav>

      <section id="generator" class="generator-card">
        <div class="generator-head"><div><h2>内置分流策略</h2><p>选择要启用的服务分类，生成器会使用内置节点组和规则模板。</p></div><button id="generate-button" type="button">生成配置 →</button></div>
        <div id="route-options" class="route-options"></div><h3 class="subheading">独立网址</h3><p class="section-help">这些网址不属于策略组，可单独分配节点组。</p><div id="standalone-options" class="standalone-options"></div><button id="add-standalone" class="add-group" type="button">＋ 增加独立网址</button><h3 class="subheading">独立规则</h3><p class="section-help">IP、CIDR 和 GeoIP 规则可单独分配节点组。</p><div id="rule-options" class="standalone-options"></div><button id="add-rule" class="add-group" type="button">＋ 增加独立规则</button><button id="add-route" class="add-group" type="button">＋ 增加分流策略组</button>
        <details open><summary>节点组（可编辑）</summary><div class="shared-settings"><label><span>统一测速间隔（秒）</span><input id="group-interval" type="number" min="0" value="30"><small>所有节点组多久重新测速一次</small></label><label><span>统一容差（毫秒）</span><input id="group-tolerance" type="number" min="0" value="10"><small>所有节点组避免频繁切换的延迟差</small></label></div><div id="group-options" class="group-options"></div><button id="add-group" class="add-group" type="button">＋ 增加节点组</button></details>
      </section>

      <div id="drawer-backdrop" class="drawer-backdrop hidden"></div><aside id="domain-drawer" class="domain-drawer" aria-label="网址列表编辑器"><div class="drawer-head"><h2 id="drawer-title">网址列表</h2><button id="close-drawer" type="button">×</button></div><p>每个网址可单独指定导向节点组。</p><div id="drawer-items"></div><button id="save-domains" class="save-domains" type="button">保存网址列表</button></aside>

      <section id="converter-toolbar" class="toolbar hidden">
        <label class="file-button">导入 JSON<input id="file-input" type="file" accept="application/json,.json" /></label>
        <button id="format-button" type="button">格式化 JSON</button>
        <button id="reset-button" type="button">恢复示例</button>
        <span id="status" role="status"></span>
      </section>

      <section id="converter" class="workspace hidden">
        <div class="panel source-panel">
          <div class="panel-heading"><h2>规则源</h2><span>rules-source.json</span></div>
          <textarea id="source" spellcheck="false" aria-label="规则源 JSON"></textarea>
        </div>
        <div class="panel output-panel">
          <div class="panel-heading">
            <h2>生成结果</h2>
            <div class="tabs"><button class="tab active" data-output="clash">Clash JS</button><button class="tab" data-output="shadowrocket">Shadowrocket</button></div>
          </div>
          <textarea id="output" readonly spellcheck="false" aria-label="生成结果"></textarea>
          <div class="output-actions"><button id="copy-button" type="button">复制</button><button id="download-button" type="button">下载文件</button></div>
        </div>
      </section>

      <footer><span id="summary">—</span><a href="https://github.com/nowaywastaken/clashjs2shadowrocket" target="_blank" rel="noreferrer">项目源码 ↗</a></footer>
    </main>
    <script src="app.js"></script>
  </body>
</html>
